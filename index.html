<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trọng Hiếu – Bio</title>
    <meta name="description" content="Trang bio cá nhân của Trọng Hiếu – Dự án, Kết nối và Liên hệ.">
    <link rel="canonical" href="https://tronghieu1201.github.io/bio_itme/">
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="apple-touch-icon" href="images/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Background blobs -->
    <div class="blob blob--1" aria-hidden="true"></div>
    <div class="blob blob--2" aria-hidden="true"></div>
    <div class="blob blob--3" aria-hidden="true"></div>

    <main class="bio-card home-bio-card">
        <!-- Profile header -->
        <header class="profile-header">
            <div class="avatar-ring">
                <img src="https://res.cloudinary.com/dtpw5htqs/image/upload/v1789624618/3D8924F9-2FD1-4578-B159-7E36568635E7_1_mkxl4m.jpg"
                    alt="Ảnh đại diện Trọng Hiếu 1" class="avatar-img avatar-img--1" width="140" height="140">
                <img src="https://res.cloudinary.com/dtpw5htqs/image/upload/v1789624620/IMG_7169_e1daku.jpg"
                    alt="Ảnh đại diện Trọng Hiếu 2" class="avatar-img avatar-img--2" width="140" height="140">
            </div>
            <button type="button" class="profile-name profile-name-btn" id="profile-info-open">
                trg.hy_
            </button>
        </header>

        <!-- Navigation Hub (3 phần điều hướng chính) -->
        <section class="link-hub" id="link-hub" aria-label="Điều hướng chính">
            <button type="button" class="group-card" data-panel-target="panel-du-an">
                <span class="group-card__icon">
                    <img src="images/backlog.png" alt="Dự án" class="group-card__img">
                </span>
                <span class="group-card__body">
                    <span class="group-card__title">Dự án</span>
                </span>
                <i class="fas fa-chevron-right group-card__arrow" aria-hidden="true"></i>
            </button>

            <button type="button" class="group-card" data-panel-target="panel-ket-noi">
                <span class="group-card__icon">
                    <img src="images/connection.png" alt="Kết nối" class="group-card__img">
                </span>
                <span class="group-card__body">
                    <span class="group-card__title">Kết nối</span>
                </span>
                <i class="fas fa-chevron-right group-card__arrow" aria-hidden="true"></i>
            </button>

            <button type="button" class="group-card" data-panel-target="panel-lien-he">
                <span class="group-card__icon">
                    <img src="images/contacts.png" alt="Liên hệ" class="group-card__img">
                </span>
                <span class="group-card__body">
                    <span class="group-card__title">Liên hệ</span>
                </span>
                <i class="fas fa-chevron-right group-card__arrow" aria-hidden="true"></i>
            </button>
        </section>

        <!-- Panel 1: Dự án -->
        <div class="link-panel" id="panel-du-an" aria-hidden="true">
            <button type="button" class="panel-back" data-panel-back aria-label="Quay lại">
                <i class="fas fa-arrow-left" aria-hidden="true"></i>
            </button>
            <div class="link-group__list">
                <button type="button" class="link-btn link-btn--chatbot" id="link-chatbot" data-closed-product>
                    <img src="images/favicon Marketing.png" alt="Chatbot Tư vấn Marketing" class="link-btn__img">
                    <span>Chatbot Marketing</span>
                </button>
                <a href="https://tronghieu1201.github.io/timebox/" target="_blank" rel="noopener noreferrer"
                    class="link-btn link-btn--timebox" id="link-timebox"
                    data-qr-src="images/qr_timebox.png"
                    data-qr-alt="Mã QR timebox phóng to"
                    data-title="timebox">
                    <img src="images/drilldown.jpg" alt="timebox" class="link-btn__img">
                    <span>timebox</span>
                </a>
                <button type="button" class="link-btn link-btn--local-sound" id="link-local-sound" data-closed-product>
                    <img src="images/logo.png" alt="local music" class="link-btn__img">
                    <span>local music</span>
                </button>
                <button type="button" class="link-btn link-btn--gym" id="link-gym" data-closed-product>
                    <img src="images/favicon copy.png" alt="Gym Tracker" class="link-btn__img">
                    <span>Gym Tracker</span>
                </button>
            </div>
        </div>

        <!-- Panel 2: Kết nối -->
        <div class="link-panel" id="panel-ket-noi" aria-hidden="true">
            <button type="button" class="panel-back" data-panel-back aria-label="Quay lại">
                <i class="fas fa-arrow-left" aria-hidden="true"></i>
            </button>
            <div class="link-group__list">
                <a href="https://www.facebook.com/trg.hy.0406" target="_blank" rel="noopener noreferrer"
                    class="link-btn link-btn--facebook" id="link-facebook"
                    data-qr-src="images/qr_fb.png"
                    data-qr-alt="Mã QR Facebook phóng to"
                    data-title="Facebook">
                    <i class="fab fa-facebook-f" aria-hidden="true"></i>
                    <span>Facebook</span>
                </a>
                <a href="https://www.instagram.com/trg.hy_/" target="_blank" rel="noopener noreferrer"
                    class="link-btn link-btn--instagram" id="link-instagram"
                    data-qr-src="images/qr_instagram.png"
                    data-qr-alt="Mã QR Instagram phóng to"
                    data-title="Instagram">
                    <i class="fab fa-instagram" aria-hidden="true"></i>
                    <span>Instagram</span>
                </a>
                <a href="https://t.me/trghy0406" target="_blank" rel="noopener noreferrer"
                    class="link-btn link-btn--telegram" id="link-telegram"
                    data-qr-src="images/qr_tele.webp"
                    data-qr-alt="Mã QR Telegram phóng to"
                    data-title="Telegram">
                    <i class="fab fa-telegram-plane" aria-hidden="true"></i>
                    <span>Telegram</span>
                </a>
                <a href="https://www.whatsapp.com/" target="_blank" rel="noopener noreferrer"
                    class="link-btn link-btn--whatsapp" id="link-whatsapp"
                    data-qr-src="images/qr_whatsapp.jpg"
                    data-qr-alt="Mã QR WhatsApp phóng to"
                    data-title="WhatsApp">
                    <i class="fab fa-whatsapp" aria-hidden="true"></i>
                    <span>WhatsApp</span>
                </a>
                <a href="https://www.linkedin.com/in/tronghieu-dev/" target="_blank" rel="noopener noreferrer"
                    class="link-btn link-btn--linkedin" id="link-linkedin"
                    data-qr-src="images/qr_linkedin.png"
                    data-qr-alt="Mã QR LinkedIn phóng to"
                    data-title="LinkedIn">
                    <i class="fab fa-linkedin-in" aria-hidden="true"></i>
                    <span>LinkedIn</span>
                </a>
                <a href="https://github.com/tronghieu1201" target="_blank" rel="noopener noreferrer"
                    class="link-btn link-btn--github" id="link-github"
                    data-qr-src="images/qr_github.png"
                    data-qr-alt="Mã QR GitHub phóng to"
                    data-title="GitHub">
                    <i class="fab fa-github" aria-hidden="true"></i>
                    <span>GitHub</span>
                </a>
                <a href="https://www.tiktok.com/@em_hiusss?_r=1&_t=ZS-99wD3kCrjNg" target="_blank" rel="noopener noreferrer"
                    class="link-btn link-btn--tiktok" id="link-tiktok"
                    data-qr-src="images/qr_tiktok.jpg"
                    data-qr-alt="Mã QR TikTok phóng to"
                    data-title="TikTok">
                    <i class="fab fa-tiktok" aria-hidden="true"></i>
                    <span>TikTok</span>
                </a>
                <a href="https://locket.camera/links/Z5eRuLziCZaLzkZq8" target="_blank" rel="noopener noreferrer"
                    class="link-btn link-btn--locket" id="link-locket"
                    data-qr-src="images/qr_locket.png"
                    data-qr-alt="Mã QR Locket phóng to"
                    data-title="Locket">
                    <i class="fas fa-heart" aria-hidden="true"></i>
                    <span>Locket</span>
                </a>
                <a href="https://zalo.me" target="_blank" rel="noopener noreferrer"
                    class="link-btn link-btn--zalo" id="link-zalo"
                    data-qr-src="images/qr_zalo.webp"
                    data-qr-alt="Mã QR Zalo phóng to"
                    data-title="Zalo">
                    <i class="fas fa-qrcode" aria-hidden="true"></i>
                    <span>Zalo</span>
                </a>
            </div>
        </div>

        <!-- Panel 3: Liên hệ -->
        <div class="link-panel" id="panel-lien-he" aria-hidden="true">
            <button type="button" class="panel-back" data-panel-back aria-label="Quay lại">
                <i class="fas fa-arrow-left" aria-hidden="true"></i>
            </button>
            <div class="link-group__list">
                <button type="button" class="link-btn link-btn--email" id="link-email"
                    data-email="tronghieu.dev16@gmail.com">
                    <i class="fas fa-at" aria-hidden="true"></i>
                    <span>Email</span>
                </button>
            </div>
        </div>

        <!-- QR Choice Confirmation Modal -->
        <div class="qr-choice-modal" id="qr-choice-modal" role="dialog" aria-modal="true" aria-label="Tùy chọn mở liên kết"
            aria-hidden="true">
            <div class="qr-choice-modal__backdrop"></div>
            <article class="qr-choice-modal__card">
                <button class="qr-choice-modal__close" id="qr-choice-close" aria-label="Đóng">&times;</button>
                <div class="qr-choice-modal__header">
                    <div class="qr-choice-modal__icon">
                        <i class="fas fa-qrcode" aria-hidden="true"></i>
                    </div>
                    <h2 class="qr-choice-modal__title">Bạn muốn truy cập bằng cách nào?</h2>
                </div>
                <div class="qr-choice-modal__actions">
                    <button type="button" class="qr-choice-btn qr-choice-btn--yes" id="qr-choice-btn-yes">
                        <i class="fas fa-qrcode" aria-hidden="true"></i>
                        <span>Quét mã QR</span>
                    </button>
                    <button type="button" class="qr-choice-btn qr-choice-btn--no" id="qr-choice-btn-no">
                        <i class="fas fa-arrow-up-right-from-square" aria-hidden="true"></i>
                        <span>Mở liên kết</span>
                    </button>
                </div>
            </article>
        </div>

        <!-- QR Lightbox -->
        <div class="lightbox" id="qr-lightbox" role="dialog" aria-label="QR phóng to" aria-hidden="true">
            <div class="lightbox__backdrop"></div>
            <div class="lightbox__content">
                <button class="lightbox__close" id="qr-lightbox-close" aria-label="Đóng">&times;</button>
                <img src="images/qr_zalo.webp"
                    alt="Mã QR phóng to" class="lightbox__img" id="qr-lightbox-img" loading="lazy"
                    decoding="async">
            </div>
        </div>

        <!-- Profile info card -->
        <div class="profile-modal" id="profile-info-modal" role="dialog" aria-label="Thông tin cá nhân"
            aria-hidden="true">
            <div class="profile-modal__backdrop"></div>
            <article class="profile-modal__card">
                <button class="profile-modal__close" id="profile-info-close" aria-label="Đóng">&times;</button>
                <h2 class="profile-modal__title">Thông tin</h2>
                <div class="profile-modal__content">
                    <p class="profile-modal__empty">Cát Minh - Phù Cát - Bình Định</p>
                </div>
            </article>
        </div>
    </main>

    <!-- Toast notification -->
    <div class="toast" id="toast" aria-live="polite"></div>

    <script src="theme.js"></script>
</body>

</html>
